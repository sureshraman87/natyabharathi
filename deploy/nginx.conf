# /etc/nginx/sites-available/natyabharathi
# Reverse proxy + static/media file serving for natyabharathi.sureshraman.com.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/natyabharathi
#   sudo ln -s /etc/nginx/sites-available/natyabharathi /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Run certbot afterwards to add the HTTPS server block automatically:
#   sudo certbot --nginx -d natyabharathi.sureshraman.com -d www.natyabharathi.sureshraman.com

server {
    listen 80;
    listen [::]:80;
    server_name natyabharathi.sureshraman.com www.natyabharathi.sureshraman.com;

    client_max_body_size 200M;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /var/www/natyabharathi/staticfiles/;
    }

    location /media/ {
        alias /var/www/natyabharathi/media/;
    }

    location / {
        proxy_pass http://unix:/run/natyabharathi/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
